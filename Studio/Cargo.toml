[package]
name = "kaic-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Локальная нативная студия диалогов, терминала и агентов"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
futures-util = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
resvg = "0.45"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

