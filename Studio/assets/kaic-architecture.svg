  <text x="684" y="458" text-anchor="end" fill="#8FB4F2" font-family="ui-monospace, monospace" font-size="10.5">KAIC NATIVE</text>
  <text x="398" y="481" fill="#A8A6A2" font-family="ui-monospace, monospace" font-size="11">/v1/chat/completions &amp; /v1/messages SSE</text>
  <text x="398" y="501" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">Env API keys only · explicit remote consent</text>
