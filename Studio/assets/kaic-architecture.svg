  <text x="74" y="298" fill="#F4F1EC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Loop, Compaction &amp; Subtasks (&lt;= 2)</text>
  <text x="74" y="318" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• Fallback tool parser · JSON repair · GBNF</text>
  <text x="74" y="336" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• Context compaction · dynamic OFF default</text>
  <text x="74" y="354" fill="#5DB57A" font-family="ui-monospace, monospace" font-size="10.5">• SHA-256 verified + edit invalidation</text>

  <!-- Box 2B: File Policy -->
  <rect x="378" y="276" width="318" height="98" rx="8" fill="#1C1C20" stroke="#5FC2B0" stroke-width="1"/>
  <text x="394" y="298" fill="#5FC2B0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Axis 1: File Tools (AgentPolicy)</text>
  <text x="394" y="318" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• read / write / edit / apply_patch / skills</text>
  <text x="394" y="336" fill="#A8A6A2" font-family="ui-monospace, monospace" font-size="11">• Kernel openat(O_NOFOLLOW) TOCTOU</text>
  <text x="394" y="354" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• Secret denylist (.env, keys, auth.json)</text>

  <!-- Box 2C: Exec Policy -->
  <rect x="714" y="276" width="308" height="98" rx="8" fill="#1C1C20" stroke="#E5AE45" stroke-width="1"/>
  <text x="730" y="298" fill="#E5AE45" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Axis 2: Code Exec (ExecPolicy)</text>
  <text x="730" y="318" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• safe-inspect · confirm-code · allow-builds</text>
  <text x="730" y="336" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">• Real cargo, make, cmake, pytest, npm</text>
  <text x="730" y="354" fill="#E5AE45" font-family="ui-monospace, monospace" font-size="10.5">• Single-use SHA-256 approval · no sandbox</text>

