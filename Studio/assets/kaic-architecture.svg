  <text x="56" y="501" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">SSE &amp; /api/chat NDJSON · per-action HITL</text>
  <text x="56" y="518" fill="#6E6E76" font-family="ui-monospace, monospace" font-size="10">Linux: tested · FreeBSD: unverified</text>

