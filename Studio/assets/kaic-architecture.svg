  <text x="758" y="459" fill="#F4F1EC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Codex, Claude Code &amp; agy CLI</text>
  <text x="1026" y="458" text-anchor="end" fill="#8FB4F2" font-family="ui-monospace, monospace" font-size="10.5">EXTERNAL CLI</text>
  <text x="740" y="481" fill="#A8A6A2" font-family="ui-monospace, monospace" font-size="11">Official local CLIs · stream-json / JSONL</text>
  <text x="740" y="501" fill="#A8A6A2" font-family="system-ui, sans-serif" font-size="11.5">Explicit consent + CLI sandbox / plan mode</text>
