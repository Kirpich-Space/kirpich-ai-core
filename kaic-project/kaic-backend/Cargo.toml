[package]
name = "kaic"
version = "0.1.0"
edition = "2021"
description = "Kirpich AI Core — личная локальная агентная система"
authors = ["Kirpich"]

[[bin]]
name = "kaic"
path = "src/main.rs"

[dependencies]
# Async runtime — нужен всем компонентам: Scheduler, Model Backend, Telegram Bridge
tokio = { version = "1", features = ["full"] }

# HTTP-сервер для Control Center API (Electron сейчас, Telegram Bridge позже —
# оба обычные HTTP-клиенты одного и того же API)
axum = "0.7"

# CORS для Electron renderer, обращающегося к localhost с другого origin
tower-http = { version = "0.5", features = ["cors"] }

# Позволяет использовать async-методы в trait ModelBackend как dyn-объект
# (нативный async fn в trait пока не object-safe в стабильном Rust)
async-trait = "0.1"

# Конфиги (Capability Registry, Resource Registry) — простые YAML-таблицы
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Разбор ответов внешних API (Openverse в медиа-пайплайне). Уже присутствовал
# в дереве транзитивно через reqwest/teloxide — здесь лишь объявлен прямой
# зависимостью, версия в Cargo.lock не меняется.
serde_json = "1"

# HTTP-клиент для Model Backend → LM Studio (OpenAI-совместимый API).
# Без TLS-бэкенда: мы всегда обращаемся только к http://localhost,
# native-tls/OpenSSL здесь не нужны и лишь усложняют сборку на Windows.
# Изначально собирался без TLS: единственным адресатом был http://localhost
# (LM Studio). С появлением медиа-пайплайна это перестало быть верным —
# Openverse доступен только по HTTPS, и без TLS-бэкенда reqwest отправляет
# plain HTTP на 443 порт, получая от Cloudflare 400 "The plain HTTP request
# was sent to HTTPS port".
#
# Взят rustls, а не native-tls: исходное возражение было против
# OpenSSL/native-tls, усложняющих сборку на Windows, — rustls его не
# затрагивает, это чистый Rust без системных зависимостей.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Task Store — персистентность в один файл, без отдельного сервиса БД
rusqlite = { version = "0.31", features = ["bundled"] }

# Telegram Bridge — Human-in-the-Loop
teloxide = { version = "0.13", features = ["macros"] }

# Task ID
uuid = { version = "1", features = ["v4", "serde"] }

# Таймстемпы задач
chrono = { version = "0.4", features = ["serde"] }

# Логирование — минимальное, чтобы видеть что происходит без присмотра
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Простая обработка ошибок без ручных Error-enum на каждый случай
anyhow = "1"

# Встроенный inference через llama.cpp — опционально (см. [features] ниже).
# Без явного --features embedded-backend эта зависимость вообще не тянется,
# поэтому обычный `cargo build` не требует CUDA Toolkit, как и раньше.
llama-cpp-4 = { version = "0.4.2", optional = true }
encoding_rs = { version = "0.8", optional = true }
# MCP-клиент — официальный SDK. Вариант выбран архитектором после разведки:
# rmcp + транспорт stdio + локальные модели.
#
# `default-features = false` не косметика. Умолчание тянет `server`, `macros`,
# `schemars`, `base64`, `uuid` и `transport-async-rw` — всё это нужно тому, кто
# ПИШЕТ сервер, а мы только ходим клиентом к чужому. Из транспортов взят
# единственный: `transport-child-process` (запуск сервера подпроцессом по
# stdio). Ни Streamable HTTP, ни SSE, ни reqwest-ветка SDK не подключены.
#
# Цена замерена, а не предположена: +8 крейтов в Cargo.lock (308 → 316).
# Из них 5 — семейство `windows`, которое `process-wrap` использует для
# управления жизнью подпроцесса; `nix` — то же самое под Unix; плюс сам
# `rmcp` и `process-wrap`. Ни tokio, ни tower, ни serde новыми не пришли —
# они уже были в дереве через axum. Порог остановки был 40 крейтов.
rmcp = { version = "3.1.2", default-features = false, features = [
    "client",
    "transport-child-process",
] }

[features]
# CPU-инференс через встроенный llama.cpp, без внешнего LM Studio.
embedded-backend = ["dep:llama-cpp-4", "dep:encoding_rs"]
# То же самое + CUDA-оффлоад (требует установленный CUDA Toolkit для сборки).
embedded-backend-cuda = ["embedded-backend", "llama-cpp-4/cuda"]

[profile.release]
opt-level = 3
lto = true
