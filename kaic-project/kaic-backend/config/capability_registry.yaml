# Capability Registry — категория задачи → модель.
# Router определяет только категорию (см. router.rs), а этот файл
# решает, какая модель отвечает за неё. Чтобы поменять модель —
# правится только этот файл, код не трогается.

# Fallback добавлен по факту живого отказа: у Nemotron vram_mb — полный
# footprint (25723 MB), он больше TOTAL_VRAM_MB, поэтому Scheduler не выберет
# его никогда, и категория без запасного варианта была мертва целиком
# (реальное сообщение "/start" боту завершилось Failed).
# Fable9B здесь уместен вдвойне: он always_loaded, то есть уже в видеопамяти,
# и коротким задачам не приходится ждать загрузки модели.
Simple:
  primary: Nemotron
  fallback:
    - Fable9B

Programming:
  primary: Fable9B
  fallback:
    - GLM47
    - GPTOSS20
    - Gemma27

LargeProject:
  primary: GPTOSS20
  fallback:
    - Gemma27

Engineering:
  primary: GLM51
  fallback:
    - Gemma27
    - GPTOSS20

DeepAnalysis:
  primary: Gemma27
  fallback:
    - GLM51

Video:
  # Само видео монтируется через ffmpeg (см. Tool System), не через LLM.
  # Модель нужна для сопутствующих текстовых задач: описание, название,
  # таймкоды, разбор сценария.
  primary: Fable9B
  fallback:
    - GLM47

Research:
  primary: Fable9B
  fallback:
    - Gemma27
    - GLM51

MaximumQuality:
  primary: Qwen40B
  manual_only: true
