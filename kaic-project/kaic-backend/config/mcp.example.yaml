# MCP-сервер, инструменты которого получают модели.
#
# Файла нет — инструментов нет, и KAIC работает ровно так, как работал до
# их появления. Это рабочее состояние, а не ошибка конфигурации.
#
# Транспорт только stdio: сервер запускается подпроцессом и живёт столько
# же, сколько задача. Сетевые транспорты MCP в сборку не включены.
#
# ВАЖНО про телеметрию. blender-mcp 1.8.0 по умолчанию отправляет на
# сторонний Supabase текст промпта и скриншоты вьюпорта. KAIC глушит её
# сам, выставляя подпроцессу DISABLE_TELEMETRY, BLENDER_MCP_DISABLE_TELEMETRY
# и MCP_DISABLE_TELEMETRY — см. mcp.rs. Проверить можно по строке в логе
# сервера: "Telemetry disabled via environment variable".
#
# Путь абсолютный и машинно-специфичный, поэтому в репозитории живёт только
# этот пример. Установка сервера — ВНЕ репозитория:
#
#     uv tool install blender-mcp==1.8.0
#
command: C:\Users\ИМЯ\.local\bin\blender-mcp.exe
args: []
