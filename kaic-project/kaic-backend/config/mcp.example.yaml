# MCP-сервер, инструменты которого получают модели.
#
# Файла нет — инструментов нет, и KAIC работает ровно так, как работал до
# их появления. Это рабочее состояние, а не ошибка конфигурации.
#
# Транспорт только stdio: сервер запускается подпроцессом и живёт столько
# же, сколько задача. Сетевые транспорты MCP в сборку не включены.
#
# ВАЖНО про телеметрию. blender-mcp 1.8.0 по умолчанию отправляет на
# сторонний Supabase текст промпта и скриншоты вьюпорта. KAIC глушит её
# сам, выставляя подпроцессу DISABLE_TELEMETRY, BLENDER_MCP_DISABLE_TELEMETRY
# и MCP_DISABLE_TELEMETRY — см. mcp.rs. Проверить можно по строке в логе
# сервера: "Telemetry disabled via environment variable".
#
# Путь абсолютный и машинно-специфичный, поэтому в репозитории живёт только
# этот пример. Установка сервера — ВНЕ репозитория:
#
#     uv tool install blender-mcp==1.8.0
#
command: C:\Users\ИМЯ\.local\bin\blender-mcp.exe
args: []

# Инструменты, которые разрешено вызывать БЕЗ подтверждения человеком.
#
# Пустой список — умолчание, и оно принципиальное: каждый вызов
# останавливает задачу в WaitingForHuman, показывает имя инструмента и
# аргументы ЦЕЛИКОМ, и ждёт явного «да» или «нет». Система, которая по
# умолчанию исполняет, однажды исполнит не то — а в наборе blender-mcp есть
# execute_blender_code, то есть произвольный Python внутри проекта
# пользователя и с доступом к его файловой системе.
#
# Что НЕ является основанием внести имя сюда:
#
#   * аннотации сервера. MCP отдаёт подсказки readOnlyHint/destructiveHint,
#     и спецификация прямо называет их недоверенными. KAIC их даже не
#     читает — поле не доходит до внутреннего описания инструмента;
#   * вид имени. Префикс `get_` безопасности не означает:
#     get_viewport_screenshot читает экран пользователя, а
#     get_polyhaven_categories ходит в сеть.
#
# Сравнение имён точное: ни масок, ни префиксов, ни регистронезависимости.
#
# Ниже — кандидаты blender-mcp на чтение сцены, ЗАКОММЕНТИРОВАННЫЕ намеренно.
# Раскомментировать их — решение владельца машины, а не умолчание поставки:
# даже чтение сцены выносит наружу содержимое проекта.
auto_approve: []
#auto_approve:
#  - get_scene_info      # состав сцены: имена объектов, материалы
#  - get_object_info     # параметры одного объекта
# НЕ добавлять не глядя:
#  - get_viewport_screenshot  # снимок экрана пользователя
#  - execute_blender_code     # произвольный Python

