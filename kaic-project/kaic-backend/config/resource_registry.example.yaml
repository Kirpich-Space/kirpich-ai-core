# Resource Registry — ресурсные характеристики моделей для Scheduler.
# В отличие от capability_registry.yaml, здесь не "что модель умеет",
# а "сколько она стоит": память под модель и время загрузки.
#
# vram_mb — ПОЛНЫЙ (max) footprint модели, а не наблюдавшееся потребление.
# Имя историческое и осталось от времён, когда бюджет равнялся видеопамяти;
# сегодня число сравнивается с TOTAL_MODEL_MEMORY_MB (main.rs) — всей
# памятью машины, отданной моделям, за вычетом резерва под ОС.
#
# Получается командой:
#
#     lms load <lm_studio_key> --gpu max --estimate-only
#
# Она печатает "Estimated Total Memory: N GiB"; в файл идёт N × 1024.
# Оценка не зависит от того, что загружено в LM Studio в момент замера
# (проверено контрольным замером одной модели при загруженном соседе и на
# пустом LM Studio — числа совпали), поэтому очищать память перед замером
# не нужно.
#
# ram_offload_mb — диагностика для GUI/логов, Scheduler это число
# в решениях не использует.
#
# path — опционально. Нужен только моделям, которые загружает встроенный
# backend (EmbeddedBackend, поверх llama.cpp) напрямую по пути к файлу.
# Модели, которые обслуживает LMStudioBackend, обращаются по ключу через
# LM Studio и это поле не заполняют — как показано ниже.
#
# ВНИМАНИЕ. Числа ниже — НЕ значения по умолчанию и не оценки "на глаз".
# Это реальные замеры с машины разработчика (RTX 4060 8 GiB + 32 GiB DDR4,
# 2026-08-07), приведённые как образец формата и порядка величин. На вашей
# машине footprint тех же моделей будет другим — квантование, версия
# LM Studio и размер контекста меняют его. Перезамерьте командой выше,
# прежде чем полагаться на планирование.
#
# Плейсхолдеры вместо чисел здесь невозможны: vram_mb обязателен и должен
# быть числом. Ноль как "заполню потом" не ставить ни при каких условиях —
# модель с нулём проходит любой бюджет и ломает планирование молча.
# Именно так этот файл и ошибался раньше.

# always_loaded — модель не подлежит вытеснению по LRU и занимает бюджет
# постоянно. Сумма always_loaded-моделей обязана помещаться в бюджет,
# иначе backend откажется стартовать.
