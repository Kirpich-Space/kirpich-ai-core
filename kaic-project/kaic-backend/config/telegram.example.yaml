# Telegram Bridge (Сценарий А) — настройки бота-ассистента.
# Скопируй как config/telegram.yaml и поправь под себя. Файл целиком
# необязателен: без него используются значения по умолчанию, указанные ниже.
#
# ТОКЕН ЗДЕСЬ НЕ ХРАНИТСЯ. Он читается из переменной окружения
# TELOXIDE_TOKEN (конвенция библиотеки teloxide). Если переменная не задана,
# Telegram Bridge не запускается, а остальной backend работает как обычно.

# Пометка, которой сопровождается каждое сообщение, отправленное агентом от
# имени пользователя. Включена по умолчанию и добавляется на этапе ОТПРАВКИ,
# а не вписывается в текст черновика — чтобы её нельзя было потерять правкой
# черновика. Отключается только явной кнопкой «Отправить без пометки» на
# конкретное сообщение.
assistant_label: "🤖 сообщение от ассистента"

# Сколько секунд подтверждение черновика остаётся действительным.
# Одобрение, пролежавшее дольше, аннулируется: в живом разговоре контекст
# успевает уйти, и отправлять по устаревшему решению нельзя.
approval_ttl_seconds: 900

# Append-only журнал отправок. Пишется по той же логике, что и
# .kaic/write-audit.log в Tool Layer: только дозапись, никогда не перезапись.
audit_log_path: ".kaic/telegram-audit.log"

# Control Center API. Telegram Bridge — обычный HTTP-клиент того же API,
# которым пользуется Electron UI, и никаких приватных путей в backend не имеет.
api_base_url: "http://127.0.0.1:4545"

# Как часто опрашивать статус задачи, пока она выполняется.
poll_interval_ms: 1000
