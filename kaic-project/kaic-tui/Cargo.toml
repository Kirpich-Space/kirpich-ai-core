[package]
name = "kaic-tui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Терминальный клиент существующего KAIC HTTP API"

[[bin]]
name = "kaic-cli"
path = "src/main.rs"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
